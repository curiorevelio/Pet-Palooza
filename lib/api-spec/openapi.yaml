openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: PawHub API — service marketplace for pet care providers and owners
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: session
    description: Current user session and role switching
  - name: pets
    description: Pets owned by the current user
  - name: providers
    description: Service providers (browse, profile, manage)
  - name: services
    description: Services offered by providers
  - name: availability
    description: Provider availability slots
  - name: bookings
    description: Service bookings
  - name: reviews
    description: Reviews for completed bookings
  - name: discovery
    description: Discovery, dashboard summaries, and featured content
  - name: Auth
    description: Browser and mobile authentication endpoints.
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /session:
    get:
      operationId: getSession
      tags: [session]
      summary: Get the current user session
      description: Returns the domain user for the authenticated session
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
    patch:
      operationId: updateSession
      tags: [session]
      summary: Update the current user's profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: Updated session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"

  /pets:
    get:
      operationId: listPets
      tags: [pets]
      summary: List pets owned by the current user
      responses:
        "200":
          description: Pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
    post:
      operationId: createPet
      tags: [pets]
      summary: Add a new pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"

  /pets/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getPet
      tags: [pets]
      summary: Get a pet by id
      responses:
        "200":
          description: Pet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    patch:
      operationId: updatePet
      tags: [pets]
      summary: Update a pet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PetUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Pet"
    delete:
      operationId: deletePet
      tags: [pets]
      summary: Delete a pet
      responses:
        "204":
          description: Deleted

  /providers:
    get:
      operationId: listProviders
      tags: [providers]
      summary: Browse service providers
      parameters:
        - in: query
          name: serviceType
          schema:
            $ref: "#/components/schemas/ServiceType"
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: search
          schema: { type: string }
      responses:
        "200":
          description: Providers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProviderSummary"

  /providers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getProvider
      tags: [providers]
      summary: Get full provider profile, services, and reviews
      responses:
        "200":
          description: Provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDetail"

  /provider/me:
    get:
      operationId: getMyProvider
      tags: [providers]
      summary: Get the current user's provider profile (if any)
      responses:
        "200":
          description: My provider profile (or null if not a provider)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProviderResponse"
    put:
      operationId: upsertMyProvider
      tags: [providers]
      summary: Create or update the current user's provider profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProviderInput"
      responses:
        "200":
          description: Provider profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Provider"

  /provider/me/services:
    get:
      operationId: listMyServices
      tags: [services]
      summary: List the current provider's services
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Service"
    post:
      operationId: createMyService
      tags: [services]
      summary: Add a service to the current provider's offerings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"

  /provider/me/services/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    patch:
      operationId: updateMyService
      tags: [services]
      summary: Update a service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ServiceUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Service"
    delete:
      operationId: deleteMyService
      tags: [services]
      summary: Remove a service
      responses:
        "204":
          description: Deleted

  /provider/me/availability:
    get:
      operationId: listMyAvailability
      tags: [availability]
      summary: List availability slots for the current provider
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date-time }
        - in: query
          name: to
          schema: { type: string, format: date-time }
      responses:
        "200":
          description: Availability slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"
    post:
      operationId: createMyAvailability
      tags: [availability]
      summary: Add an availability slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AvailabilityInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AvailabilitySlot"

  /provider/me/availability/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    delete:
      operationId: deleteMyAvailability
      tags: [availability]
      summary: Remove an availability slot
      responses:
        "204":
          description: Deleted

  /providers/{id}/availability:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listProviderAvailability
      tags: [availability]
      summary: List open availability slots for a provider
      responses:
        "200":
          description: Open slots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AvailabilitySlot"

  /bookings:
    get:
      operationId: listBookings
      tags: [bookings]
      summary: List bookings for the current user (as owner)
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"
    post:
      operationId: createBooking
      tags: [bookings]
      summary: Book a service slot
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /bookings/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: getBooking
      tags: [bookings]
      summary: Get a booking
      responses:
        "200":
          description: Booking
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
    patch:
      operationId: updateBookingStatus
      tags: [bookings]
      summary: Update booking status (accept, complete, cancel)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BookingStatusUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"

  /provider/me/bookings:
    get:
      operationId: listMyProviderBookings
      tags: [bookings]
      summary: List bookings for the current provider
      parameters:
        - in: query
          name: status
          schema:
            $ref: "#/components/schemas/BookingStatus"
      responses:
        "200":
          description: Bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Booking"

  /reviews:
    post:
      operationId: createReview
      tags: [reviews]
      summary: Leave a review for a completed booking
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReviewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Review"

  /providers/{id}/reviews:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: integer }
    get:
      operationId: listProviderReviews
      tags: [reviews]
      summary: List reviews for a provider
      responses:
        "200":
          description: Reviews
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Review"

  /discovery/home:
    get:
      operationId: getHomeDiscovery
      tags: [discovery]
      summary: Discovery feed for the home page
      description: Featured providers, top-rated providers, and service category counts
      responses:
        "200":
          description: Home discovery
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HomeDiscovery"

  /discovery/owner-dashboard:
    get:
      operationId: getOwnerDashboard
      tags: [discovery]
      summary: Owner dashboard summary
      description: Counts and the next upcoming booking for the current owner
      responses:
        "200":
          description: Owner dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OwnerDashboard"

  /discovery/provider-dashboard:
    get:
      operationId: getProviderDashboard
      tags: [discovery]
      summary: Provider dashboard summary
      description: Earnings totals, upcoming bookings, recent reviews, and rating
      responses:
        "200":
          description: Provider dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProviderDashboard"
  /auth/user:
    get:
      tags: [Auth]
      operationId: getCurrentAuthUser
      summary: Get the currently authenticated user
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '200':
          description: Auth status resolved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUserEnvelope'
  /login:
    get:
      tags: [Auth]
      operationId: beginBrowserLogin
      summary: Start the browser OIDC login flow
      parameters:
        - name: returnTo
          in: query
          required: false
          description: Relative path to redirect to after login (must start with `/`). Defaults to `/`.
          schema:
            type: string
      responses:
        '302':
          description: Redirect to the OIDC authorization endpoint.
  /callback:
    get:
      tags: [Auth]
      operationId: handleBrowserLoginCallback
      summary: Complete the browser OIDC login flow
      parameters:
        - name: code
          in: query
          required: false
          schema:
            type: string
        - name: state
          in: query
          required: false
          schema:
            type: string
        - name: iss
          in: query
          required: false
          schema:
            type: string
            format: uri
      responses:
        '302':
          description: Redirect to the `returnTo` path on success (defaults to `/`) or `/api/login` on failure.
  /logout:
    get:
      tags: [Auth]
      operationId: logoutBrowserSession
      summary: Clear the session and begin OIDC logout
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
        - $ref: '#/components/parameters/SessionCookie'
      responses:
        '302':
          description: Redirect to the OIDC provider logout URL.
  /mobile-auth/token-exchange:
    post:
      tags: [Auth]
      operationId: exchangeMobileAuthorizationCode
      summary: Exchange a mobile OIDC code for a session token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileTokenExchangeRequest'
      responses:
        '200':
          description: Session created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MobileTokenExchangeSuccess'
        '400':
          description: Missing or invalid required fields.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '401':
          description: Token did not contain usable claims.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '500':
          description: Token exchange failed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
  /mobile-auth/logout:
    post:
      tags: [Auth]
      operationId: logoutMobileSession
      summary: Delete a mobile session token
      parameters:
        - $ref: '#/components/parameters/AuthorizationSessionHeader'
      responses:
        '200':
          description: Logout processed.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutSuccess'

components:
  parameters:
    AuthorizationSessionHeader:
      name: Authorization
      in: header
      required: false
      description: Opaque session token — `Bearer <sid>`.
      schema:
        type: string
    SessionCookie:
      name: sid
      in: cookie
      required: false
      description: Browser session cookie.
      schema:
        type: string
  schemas:
    AuthUser:
      type: object
      required: [id, email, firstName, lastName, profileImageUrl]
      properties:
        id:
          type: string
        email:
          type: [string, 'null']
          format: email
        firstName:
          type: [string, 'null']
        lastName:
          type: [string, 'null']
        profileImageUrl:
          type: [string, 'null']
    AuthUserEnvelope:
      type: object
      required: [user]
      properties:
        user:
          oneOf:
            - $ref: '#/components/schemas/AuthUser'
            - type: 'null'
    MobileTokenExchangeRequest:
      type: object
      required: [code, code_verifier, redirect_uri, state]
      properties:
        code:
          type: string
          minLength: 1
        code_verifier:
          type: string
          minLength: 1
        redirect_uri:
          type: string
          minLength: 1
          format: uri
        state:
          type: string
          minLength: 1
        nonce:
          type: string
          minLength: 1
    MobileTokenExchangeSuccess:
      type: object
      required: [token]
      properties:
        token:
          type: string
    LogoutSuccess:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
          const: true
    ErrorEnvelope:
      type: object
      required: [error]
      properties:
        error:
          type: string
    HealthStatus:
      type: object
      properties:
        status: { type: string }
      required: [status]

    ServiceType:
      type: string
      enum: [walking, sitting, grooming, washing, training]

    BookingStatus:
      type: string
      enum: [requested, confirmed, completed, cancelled]

    PetSpecies:
      type: string
      enum: [dog, cat, other]

    UserRole:
      type: string
      enum: [owner, provider]

    Session:
      type: object
      required: [user, isProvider]
      properties:
        user: { $ref: "#/components/schemas/User" }
        isProvider: { type: boolean }
        providerId: { type: ["integer", "null"] }

    User:
      type: object
      required: [id, displayName, email, city]
      properties:
        id: { type: integer }
        displayName: { type: string }
        email: { type: string }
        city: { type: string }
        avatarUrl: { type: ["string", "null"] }

    UserUpdate:
      type: object
      properties:
        displayName: { type: string }
        city: { type: string }
        avatarUrl: { type: ["string", "null"] }

    Pet:
      type: object
      required: [id, ownerId, name, species, createdAt]
      properties:
        id: { type: integer }
        ownerId: { type: integer }
        name: { type: string }
        species: { $ref: "#/components/schemas/PetSpecies" }
        breed: { type: ["string", "null"] }
        ageYears: { type: ["integer", "null"] }
        weightLbs: { type: ["integer", "null"] }
        photoUrl: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    PetInput:
      type: object
      required: [name, species]
      properties:
        name: { type: string, minLength: 1 }
        species: { $ref: "#/components/schemas/PetSpecies" }
        breed: { type: string }
        ageYears: { type: integer, minimum: 0 }
        weightLbs: { type: integer, minimum: 0 }
        photoUrl: { type: string }
        notes: { type: string }

    PetUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        species: { $ref: "#/components/schemas/PetSpecies" }
        breed: { type: ["string", "null"] }
        ageYears: { type: ["integer", "null"] }
        weightLbs: { type: ["integer", "null"] }
        photoUrl: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }

    Provider:
      type: object
      required: [id, userId, businessName, city, createdAt]
      properties:
        id: { type: integer }
        userId: { type: integer }
        businessName: { type: string }
        bio: { type: ["string", "null"] }
        city: { type: string }
        zipCode: { type: ["string", "null"] }
        photoUrl: { type: ["string", "null"] }
        coverPhotoUrl: { type: ["string", "null"] }
        yearsExperience: { type: ["integer", "null"] }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }

    ProviderInput:
      type: object
      required: [businessName, city]
      properties:
        businessName: { type: string, minLength: 1 }
        bio: { type: string }
        city: { type: string, minLength: 1 }
        zipCode: { type: string }
        photoUrl: { type: string }
        coverPhotoUrl: { type: string }
        yearsExperience: { type: integer, minimum: 0 }

    ProviderSummary:
      type: object
      required: [id, businessName, city, serviceTypes, ratingAverage, reviewCount, startingPriceCents, verified]
      properties:
        id: { type: integer }
        businessName: { type: string }
        city: { type: string }
        photoUrl: { type: ["string", "null"] }
        coverPhotoUrl: { type: ["string", "null"] }
        bio: { type: ["string", "null"] }
        verified: { type: boolean }
        yearsExperience: { type: ["integer", "null"] }
        serviceTypes:
          type: array
          items: { $ref: "#/components/schemas/ServiceType" }
        ratingAverage: { type: number }
        reviewCount: { type: integer }
        startingPriceCents: { type: ["integer", "null"] }

    ProviderDetail:
      type: object
      required: [provider, services, reviews, ratingAverage, reviewCount]
      properties:
        provider: { $ref: "#/components/schemas/Provider" }
        services:
          type: array
          items: { $ref: "#/components/schemas/Service" }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        ratingAverage: { type: number }
        reviewCount: { type: integer }

    MyProviderResponse:
      type: object
      required: [isProvider]
      properties:
        isProvider: { type: boolean }
        provider:
          oneOf:
            - { $ref: "#/components/schemas/Provider" }
            - { type: "null" }

    Service:
      type: object
      required: [id, providerId, serviceType, priceCents, durationMinutes]
      properties:
        id: { type: integer }
        providerId: { type: integer }
        serviceType: { $ref: "#/components/schemas/ServiceType" }
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        priceCents: { type: integer }
        durationMinutes: { type: integer }

    ServiceInput:
      type: object
      required: [serviceType, priceCents, durationMinutes]
      properties:
        serviceType: { $ref: "#/components/schemas/ServiceType" }
        title: { type: string }
        description: { type: string }
        priceCents: { type: integer, minimum: 0 }
        durationMinutes: { type: integer, minimum: 15 }

    ServiceUpdate:
      type: object
      properties:
        title: { type: ["string", "null"] }
        description: { type: ["string", "null"] }
        priceCents: { type: integer, minimum: 0 }
        durationMinutes: { type: integer, minimum: 15 }

    AvailabilitySlot:
      type: object
      required: [id, providerId, startAt, endAt, isBooked]
      properties:
        id: { type: integer }
        providerId: { type: integer }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        isBooked: { type: boolean }

    AvailabilityInput:
      type: object
      required: [startAt, endAt]
      properties:
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }

    Booking:
      type: object
      required: [id, petId, providerId, serviceId, startAt, endAt, status, totalCents, createdAt]
      properties:
        id: { type: integer }
        petId: { type: integer }
        providerId: { type: integer }
        serviceId: { type: integer }
        slotId: { type: ["integer", "null"] }
        startAt: { type: string, format: date-time }
        endAt: { type: string, format: date-time }
        status: { $ref: "#/components/schemas/BookingStatus" }
        notes: { type: ["string", "null"] }
        totalCents: { type: integer }
        createdAt: { type: string, format: date-time }
        pet: { $ref: "#/components/schemas/Pet" }
        provider: { $ref: "#/components/schemas/ProviderSummary" }
        service: { $ref: "#/components/schemas/Service" }
        hasReview: { type: boolean }

    BookingInput:
      type: object
      required: [petId, serviceId, slotId]
      properties:
        petId: { type: integer }
        serviceId: { type: integer }
        slotId: { type: integer }
        notes: { type: string }

    BookingStatusUpdate:
      type: object
      required: [status]
      properties:
        status: { $ref: "#/components/schemas/BookingStatus" }

    Review:
      type: object
      required: [id, bookingId, providerId, ownerId, ownerName, rating, createdAt]
      properties:
        id: { type: integer }
        bookingId: { type: integer }
        providerId: { type: integer }
        ownerId: { type: integer }
        ownerName: { type: string }
        ownerAvatarUrl: { type: ["string", "null"] }
        petName: { type: ["string", "null"] }
        serviceType: { $ref: "#/components/schemas/ServiceType" }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }

    ReviewInput:
      type: object
      required: [bookingId, rating]
      properties:
        bookingId: { type: integer }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }

    HomeDiscovery:
      type: object
      required: [featured, topRated, serviceCategoryCounts, totalProviders, totalCompletedBookings]
      properties:
        featured:
          type: array
          items: { $ref: "#/components/schemas/ProviderSummary" }
        topRated:
          type: array
          items: { $ref: "#/components/schemas/ProviderSummary" }
        serviceCategoryCounts:
          type: array
          items: { $ref: "#/components/schemas/ServiceCategoryCount" }
        totalProviders: { type: integer }
        totalCompletedBookings: { type: integer }

    ServiceCategoryCount:
      type: object
      required: [serviceType, providerCount, startingPriceCents]
      properties:
        serviceType: { $ref: "#/components/schemas/ServiceType" }
        providerCount: { type: integer }
        startingPriceCents: { type: ["integer", "null"] }

    OwnerDashboard:
      type: object
      required: [petCount, upcomingBookingCount, completedBookingCount, totalSpentCents, upcomingBookings, pets]
      properties:
        petCount: { type: integer }
        upcomingBookingCount: { type: integer }
        completedBookingCount: { type: integer }
        totalSpentCents: { type: integer }
        upcomingBookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
        pets:
          type: array
          items: { $ref: "#/components/schemas/Pet" }
        recommendedProviders:
          type: array
          items: { $ref: "#/components/schemas/ProviderSummary" }

    ProviderDashboard:
      type: object
      required: [pendingCount, upcomingCount, completedCount, totalEarningsCents, ratingAverage, reviewCount, upcomingBookings, recentReviews]
      properties:
        pendingCount: { type: integer }
        upcomingCount: { type: integer }
        completedCount: { type: integer }
        totalEarningsCents: { type: integer }
        ratingAverage: { type: number }
        reviewCount: { type: integer }
        upcomingBookings:
          type: array
          items: { $ref: "#/components/schemas/Booking" }
        recentReviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
